{% extends "base.html" %}

{% block title %}Register — Like Manager{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 64px - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-icon {
        width: 52px;
        height: 52px;
        background: var(--white);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 22px;
        box-shadow: 0 0 40px rgba(255,255,255,0.1);
        animation: iconPop 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes iconPop {
        from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
        to   { transform: scale(1) rotate(0); opacity: 1; }
    }

    .auth-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.8px;
        color: var(--white);
    }

    .auth-subtitle {
        font-size: 14px;
        color: var(--gray-500);
        margin-top: 6px;
    }

    .auth-footer {
        text-align: center;
        margin-top: 28px;
        font-size: 13px;
        color: var(--gray-500);
    }

    .auth-footer a {
        color: var(--white);
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding-bottom: 1px;
        transition: border-color 0.2s;
    }

    .auth-footer a:hover { border-color: var(--white); }

    .form-group { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    .form-group:nth-child(1) { animation-delay: 0.15s; }
    .form-group:nth-child(2) { animation-delay: 0.22s; }
    .form-group:nth-child(3) { animation-delay: 0.29s; }

    .btn-submit {
        width: 100%;
        padding: 13px;
        font-size: 14px;
        margin-top: 8px;
        animation: fadeUp 0.4s 0.35s cubic-bezier(0.16,1,0.3,1) both;
        border-radius: 10px;
    }

    .password-strength {
        height: 2px;
        background: var(--gray-300);
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
    }

    .password-strength-bar {
        height: 100%;
        border-radius: 2px;
        width: 0%;
        transition: width 0.4s var(--transition), background 0.4s;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">✦</div>
            <h1 class="auth-title">Create account</h1>
            <p class="auth-subtitle">Get started with Like Manager</p>
        </div>

        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="choose_a_username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required autocomplete="new-password"
                           oninput="updateStrength(this.value)">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="••••••••" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-submit">
                    Create account →
                </button>
            </form>
        </div>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>

<script>
function updateStrength(val) {
    const bar = document.getElementById('strengthBar');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const pct = (score / 4) * 100;
    const colors = ['#f87171','#fbbf24','#60a5fa','#4ade80'];
    bar.style.width = pct + '%';
    bar.style.background = colors[score - 1] || '#f87171';
}
</script>
{% endblock %}
